# docker-compose para desenvolvimento e produção
#
# Uso:
#   docker compose up -d                  # Sobe structure-extractor com docling
#   docker compose run --rm test          # Executa testes
#   docker compose run --rm validate      # Valida snapshots

version: "3.9"

services:
  # --- Serviço principal (com docling) ---
  acessilia-extractor:
    build:
      context: .
      target: with-docling
    image: acessilia-extractor:with-docling
    ports:
      - "8000:8000"
    volumes:
      - ./var:/app/var
      - docling-models:/root/.cache/docling
    command: ["acessilia-extract"]

  # --- Testes ---
  test:
    build:
      context: .
      target: test
    image: acessilia-extractor:test
    volumes:
      - ./tests:/app/tests
      - ./src:/app/src
    command: ["pytest", "tests/", "-v"]

  # --- Validação de snapshots ---
  validate:
    build:
      context: .
      target: validate-snapshots
    image: acessilia-extractor:validate
    volumes:
      - ./tests/dataset:/app/tests/dataset
      - ./tests/snapshot_comparator.py:/app/tests/snapshot_comparator.py
      - ./scripts/validate_snapshots.py:/app/scripts/validate_snapshots.py
      - docling-models:/root/.cache/docling
    command: ["scripts/validate_snapshots.py"]

volumes:
  docling-models:
  docling-models: